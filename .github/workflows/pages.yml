name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir -p "$RUNNER_TEMP/unstep-site"
          cp index.html style.css site.js examples.js LICENSE "$RUNNER_TEMP/unstep-site/"
          cp -R media "$RUNNER_TEMP/unstep-site/"
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/unstep-site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
